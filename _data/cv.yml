        details: "Computer vision, deep learning, semantic segmentation, underwater image enhancement, few-shot learning, efficient deep models"
      - label: Robotics
        details: "Underwater enhanced perception, robotic systems, automated task planning, semantic modeling"
      - label: Application domain
