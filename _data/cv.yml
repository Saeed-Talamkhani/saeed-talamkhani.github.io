cv:
  name: Saeed Talamkhani
  label: PhD Candidate · Computer Vision & Deep Learning for Robotic Inspection
  email: stalamkh@stevens.edu
  website: https://saeed-talamkhani.github.io
  location: Hoboken, NJ
  summary: >-
    PhD candidate at Stevens Institute of Technology developing computer vision and deep learning methods
    for robotic perception in visually degraded environments, with underwater infrastructure inspection as the
    main application. Experienced in semantic segmentation, underwater image enhancement, few-shot learning, and
    efficient model deployment through structured pruning, with first-author work in *Automation in Construction*
    and ASCE i3CE, and a Runner-up Paper Award at IConIC 2026.

  social_networks:
    - network: LinkedIn
      username: saeedtalamkhani
    - network: GitHub
      username: Saeed-Talamkhani

  address:
    city: Hoboken
    region: NJ
    countryCode: US

  sections:
    Experience:
      - company: Stevens Institute of Technology
        position: Research Assistant
        location: Hoboken, NJ
        start_date: "2023-09"
        summary: Underwater vision and robotics for automated infrastructure inspection and maintenance
        highlights:
          - "Developed a PyTorch-based semantic segmentation method to localize bridge components in underwater inspection images, achieving an IoU of 0.88."
          - "Proposed a domain-specific encoder that learns image representations from quality-specific feature maps to address underwater image degradation."
          - "Built a PyTorch pipeline integrating image enhancement, classification, and semantic segmentation for underwater structure detection."
          - "Developed a few-shot semantic segmentation method using cross-attention between query images and support-image regions of interest to detect seven common damage types on underwater bridge components."
          - "Built ontology-driven reasoning and action-planning tools to support autonomous underwater bridge inspection and maintenance decisions."

      - company: Imam Khomeini International University
        position: Research Assistant
        location: Qazvin, Iran
        start_date: "2021-03"
        end_date: "2023-06"
        summary: Machine learning for geotechnical engineering
        highlights:
          - "Engineered scikit-learn and TensorFlow pipelines to build predictive models of geotechnical engineering parameters."
          - "Analyzed experimental data using statistical, correlation, and feature-importance methods."

    Education:
      - institution: Stevens Institute of Technology
        location: Hoboken, NJ
        url: https://www.stevens.edu/
        area: Civil Engineering
        studyType: PhD
        start_date: "2023-09"
        end_date: "2027-05"
        highlights:
          - "Dissertation: *Advanced underwater vision-based robotics for automated infrastructure inspection and maintenance*"
          - "Expected completion: May 2027"

      - institution: Imam Khomeini International University
        location: Qazvin, Iran
        area: Civil Engineering
        studyType: MS
        start_date: "2015-08"
        end_date: "2018-02"
        highlights:
          - "Thesis: *Effect of Geotextile on the Undrained Shear Strength of Clayey Sand*"

      - institution: University of Qom
